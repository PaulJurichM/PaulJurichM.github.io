<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Павел Юрич</title>
<meta name="description" content="Проза Павла Юрича и интерактивные хронотопы чужих книг. Читать можно бесплатно.">
<script>(function(){try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f0e6;--paper:#fbf8f1;--ink:#25211b;--soft:#6f675a;--line:#ddd3c0;--accent:#8a3a28}
:root[data-theme="dark"]{--bg:#14161a;--paper:#1a1d22;--ink:#d8d2c4;--soft:#8f897c;--line:#2c3038;--accent:#d59566}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14161a;--paper:#1a1d22;--ink:#d8d2c4;--soft:#8f897c;--line:#2c3038;--accent:#d59566}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.6 "PT Serif",Georgia,"Times New Roman",serif}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:.18em}
.sans{font-family:"PT Sans",system-ui,sans-serif}
.top{display:flex;justify-content:flex-end;padding:.7rem 16px}
.ctl{font:400 .8rem "PT Sans",system-ui,sans-serif;color:var(--soft);background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:.15rem .6rem;cursor:pointer}
.ctl:hover{color:var(--accent);border-color:var(--accent)}
main{max-width:36rem;margin:0 auto;padding:2.5rem 16px 3rem}
h1{font-size:2.4rem;line-height:1.1;margin:0 0 .5rem}
.lead{color:var(--soft);margin:0 0 2.6rem}
h2{font:700 .78rem "PT Sans",system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:2.4rem 0 .8rem}
.card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem;
  color:var(--ink);text-decoration:none;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card b{display:block;font-size:1.25rem;margin-bottom:.25rem}
.card span{display:block;color:var(--soft);font-size:.95rem}
.card i{font:normal .8rem "PT Sans",system-ui,sans-serif;color:var(--accent);display:block;margin-top:.7rem}
ul{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:10px}
li+li{border-top:1px solid var(--line)}
li a{display:flex;justify-content:space-between;gap:1rem;padding:.75rem 1.2rem;color:var(--ink);text-decoration:none}
li a:hover{color:var(--accent)}
li small{font:.75rem "PT Sans",system-ui,sans-serif;color:var(--soft);white-space:nowrap;align-self:center}
.note{font-size:.9rem;color:var(--soft);margin:.7rem 0 0}
footer{border-top:1px solid var(--line);padding:1.2rem 16px 2rem;text-align:center;font:.75rem "PT Sans",system-ui,sans-serif;color:var(--soft)}
footer a{color:var(--soft)}
@media (max-width:520px){body{font-size:17px}h1{font-size:1.9rem}}
</style>
</head>
<body>
<main>
  <h1>Такой страницы нет</h1>
  <p class="lead">Возможно, она переехала, или в адресе опечатка.</p>
  <p class="sans"><a href="/">На главную</a> · <a href="/books/">К сборникам</a></p>
</main>
</body>
</html>
